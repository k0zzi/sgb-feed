server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    server_tokens       off;
    charset             utf-8;
    charset_types       text/plain application/json;   # text/html is the default anyway

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # --- Feeds: FEED_ALLOWED + UI_ALLOWED networks, no password (firewalls pull these) ---
    # Only files in /data/feeds whose name matches the pattern are served; the database, status file
    # and logs are never exposed even though they live on the same volume.
    #   <kind>-part<N>.txt  full history (chunks of 128,000)   kind: domain | ip | ipv6 | url
    #   <kind>-<days>d.txt  Lite (last N days)
    #   index.html / index.json  feed listing
    location = /feed {
        return 301 /feed/;
    }
    location = /feed/ {
        rewrite ^ /feed/index.html last;
    }
    location ~ ^/feed/(?<feedfile>(?:domain|ip|ipv6|url)-(?:part[0-9]+|[0-9]+d)\.txt|index\.html|index\.json)$ {
        include /etc/nginx/sgb_allow_feed.conf;
        alias /srv/feed/feeds/$feedfile;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location /feed/ {
        return 404;
    }

    # --- UI: UI_ALLOWED networks + password ---
    location / {
        include /etc/nginx/sgb_allow_ui.conf;
        auth_basic           "SGB";
        auth_basic_user_file /etc/nginx/sgb_htpasswd;

        limit_except GET { deny all; }   # the UI is read-only

        proxy_pass http://ui:8080;
        proxy_set_header X-Real-IP     $remote_addr;
        proxy_set_header X-Remote-User $remote_user;
        proxy_set_header Authorization "";   # the password is not forwarded to the UI
    }
}
